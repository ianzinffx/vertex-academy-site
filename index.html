<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertex Acadmy | Agência de Marketing Digital</title>
    <style>
        :root {
            --bg-color: #0D0D0D;
            --card-bg: #161616;
            --primary: #D4AF37;
            --text-main: #F3F3F3;
            --text-muted: #A0A0A0;
            --border-color: #262626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }

        /* Menu de Navegação */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 30px;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }

        .logo {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 8px 15px;
            border-radius: 6px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #000;
            background: var(--primary);
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid var(--border-color);
            max-width: 900px;
            margin: 0 auto;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
